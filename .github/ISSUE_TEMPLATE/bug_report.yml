name: Bug Report
description: Report a ViaNeoForgePlus bug or issue
labels: [ S-needs-triage, T-bug ]

body:
  - type: markdown
    attributes:
      value: |
        **Before reporting a bug, please check whether the latest release from https://github.com/fadeway37/ViaNeoForgePlus/releases resolves your issue.**

        You can upload screenshots or videos in any text field when relevant.

  - type: textarea
    attributes:
      label: General Information
      description: |
        Include your ViaNeoForgePlus, Minecraft, NeoForge, Java, and target server versions.
        Upload `latest.log` to mclo.gs and paste the link here.
      placeholder: |
        ViaNeoForgePlus version: paste here
        Minecraft / NeoForge / Java versions: paste here
        Target server version: paste here
        latest.log URL (mclo.gs): paste here
    validations:
      required: true

  - type: textarea
    attributes:
      label: Bug Description
      description: |
        Describe the unexpected behavior.

        If you want to attach screenshots, use the comment field at the bottom of the page.
      placeholder: |
        Example: "Joining server XY causes the game to crash."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: |
        List the exact steps required to reproduce the issue.

        Please make each step clear and easy to follow.
      placeholder: |
        Example:
        1. Join server XY using Minecraft 1.14.4
        2. The game crashes
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: |
        Describe what you expected to happen.

        If the expected behavior is obvious, this field can be left brief.
      placeholder: |
        Example: "The game should not crash when joining server XY."
    validations:
      required: true
